<div class="wrap" id="app"></div>

<script>
/* ===================== Hilfsfunktionen ===================== */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
const close=(x,y,t=1e-6)=>Math.abs(x-y)<=t;
function n2s(x){ if(isInt(x)) x=Math.round(x); let s=(Math.round(x*1000)/1000).toString().replace('.',','); return s.replace('-','−'); }
const pt=(...a)=>'('+a.map(n2s).join(' | ')+')';
const vec=(...a)=>'<span class="vec">'+a.map(x=>'<i>'+(typeof x==='string'?x:n2s(x))+'</i>').join('')+'</span>';
const ov=t=>'<span class="ov">'+t+'</span>';
const sup=d=>'<sup>'+d+'</sup>';
const rt=n=>'√'+n;
const sub=(a,b)=>a.map((x,i)=>x-b[i]);
const add=(a,b)=>a.map((x,i)=>x+b[i]);
const mul=(k,a)=>a.map(x=>k*x);
const len2=a=>a.reduce((s,x)=>s+x*x,0);
const isSquare=n=>isInt(Math.sqrt(n));
const NAMES=['x','y','z'];
function lin(v,k){ return k===0?v:(k>0?`${v} + ${k}`:`${v} − ${-k}`); }
function coordMsg(v,ans,tol){ const w=[]; v.forEach((x,i)=>{ if(!close(x,ans[i],tol||1e-6)) w.push(i) }); return w; }
function samePerm(v,ans){ return [...v].map(x=>Math.round(x*1e6)).sort((a,b)=>a-b).join()===[...ans].map(x=>Math.round(x*1e6)).sort((a,b)=>a-b).join(); }
function wrongMsg(w,extra){ return {t:'near',h:'<b>Fast.</b>Prüfe noch die '+w.map(i=>NAMES[i]+'-').join(' und ')+'Koordinate. '+(extra||'')}; }
function colinear(u,v){ // Faktor r mit v = r*u, sonst null
  let r=null; for(let i=0;i<u.length;i++){ if(Math.abs(u[i])<1e-9){ if(Math.abs(v[i])>1e-9) return null; continue; } const q=v[i]/u[i]; if(r===null) r=q; else if(!close(q,r,1e-6)) return null; } return r; }
const OK=h=>({t:'ok',h:'<b>Richtig!</b>'+(h||'')});
const NO=h=>({t:'no',h:'<b>Noch nicht richtig.</b>'+h});
const NEAR=h=>({t:'near',h:'<b>Fast.</b>'+h});

/* ===== Eingaben der Lernenden auswerten (ohne eval) ===== */
function parseExpr(str){
  if(str==null) return NaN;
  const s=String(str).trim().toLowerCase().replace(/,/g,'.').replace(/[−–—]/g,'-').replace(/[·×]/g,'*').replace(/:/g,'/').replace(/√/g,'sqrt').replace(/\s+/g,'');
  if(!s) return NaN;
  let i=0;
  const peek=()=>s[i];
  function number(){ const m=/^(\d+(\.\d+)?|\.\d+)/.exec(s.slice(i)); if(!m) return NaN; i+=m[0].length; return parseFloat(m[0]); }
  function atom(){
    if(s.startsWith('sqrt',i)){ i+=4; let v; if(peek()==='('){ i++; v=expr(); if(peek()!==')') return NaN; i++; } else v=number(); return Math.sqrt(v); }
    if(peek()==='('){ i++; const v=expr(); if(peek()!==')') return NaN; i++; return v; }
    return number();
  }
  function factor(){
    if(peek()==='-'){ i++; return -factor(); }
    if(peek()==='+'){ i++; return factor(); }
    let p=atom(); if(peek()==='^'){ i++; p=Math.pow(p,factor()); } return p;
  }
  function term(){
    let v=factor();
    for(;;){
      if(peek()==='*'){ i++; v*=factor(); }
      else if(peek()==='/'){ i++; v/=factor(); }
      else if(peek()==='('||s.startsWith('sqrt',i)){ v*=factor(); }
      else break;
    }
    return v;
  }
  function expr(){ let v=term(); for(;;){ if(peek()==='+'){ i++; v+=term(); } else if(peek()==='-'){ i++; v-=term(); } else break; } return v; }
  const v=expr();
  return (i===s.length&&isFinite(v))?v:NaN;
}
function parseList(str){
  let s=String(str||'').toLowerCase().replace(/x\d?\s*=/g,' ').replace(/l\s*=/g,' ').replace(/[{}]/g,' ').replace(/\s+(und|oder)\s+/g,';');
  let parts;
  if(s.includes(';')) parts=s.split(';'); else if(/\s/.test(s.trim())) parts=s.trim().split(/\s+/); else if(/^\s*-?\d+,\d+\s*$/.test(s)) parts=[s]; else parts=s.split(',');
  const out=parts.map(p=>p.trim()).filter(Boolean).map(parseExpr);
  return out.length&&out.every(x=>!isNaN(x))?out:null;
}
function parsePts(str){
  const out=[]; const re=/\(([^()]*)\)/g; let m;
  while((m=re.exec(String(str||'')))){ const inner=m[1]; const sepRe=/[|;]/.test(inner)?/[|;]/:/\//; const p=inner.split(sepRe); if(p.length!==2) return null; const x=parseExpr(p[0]),y=parseExpr(p[1]); if(isNaN(x)||isNaN(y)) return null; out.push([x,y]); }
  return out.length?out:null;
}
const uniq=a=>{const o=[];a.forEach(x=>{if(!o.some(y=>close(x,y))) o.push(x)});return o.sort((p,q)=>p-q)};
function sameSet(a,b){ a=uniq(a); b=uniq(b); return a.length===b.length&&a.every((x,i)=>close(x,b[i])); }

/* ===================== Aufgaben-Generatoren ===================== */
/* Jede Aufgabe: {html, inputs, check(v)->{ok,msgs}, tips:[t1,t2], solution, correct} */

/* ---- 1a Koordinaten am Körper ---- */
function gen1aB(){
  const a=rnd(2,6),b=rnd(2,6),h=rnd(2,6), X=pick(['C','F','G','H']);
  const ans={C:[a,b,0],F:[a,0,h],G:[a,b,h],H:[0,b,h]}[X];
  const why={C:`C liegt in der Grundfläche: x-Koordinate wie B, y-Koordinate wie D, Höhe 0.`,
             F:`F liegt senkrecht über B: x und y wie B, Höhe wie E.`,
             G:`G liegt senkrecht über C: x wie B, y wie D, Höhe wie E.`,
             H:`H liegt senkrecht über D: x und y wie D, Höhe wie E.`}[X];
  return {
    html:`<p>Ein Quader ABCDEFGH hat die Eckpunkte A${pt(0,0,0)}, B${pt(a,0,0)}, D${pt(0,b,0)} und E${pt(0,0,h)}. Die Grundfläche ist ABCD. E liegt über A, F über B, G über C und H über D.</p><p>Gib die Koordinaten des Punktes <b>${X}</b> an.</p>`,
    inputs:[{key:'p',label:`Koordinaten von ${X}`,type:'pt3'}],
    check(v){
      const w=coordMsg(v.p,ans); if(!w.length) return {ok:true,msgs:[OK()]};
      if(samePerm(v.p,ans)) return {ok:false,msgs:[NEAR('Die Zahlen sind richtig, aber nicht in der Reihenfolge (x | y | z).')]};
      return {ok:false,msgs:[wrongMsg(w,w.includes(2)?'Überlege, auf welcher Höhe der Punkt liegt.':'Überlege, über oder unter welchem Punkt er liegt.')]};
    },
    tips:[`Skizziere den Quader. Über welchem Punkt liegt ${X}, und auf welcher Höhe?`, why],
    solution:`<p>${why}</p><p>Also ${X}${pt(...ans)}.</p>`, correct:{p:ans}};
}
function gen1aV(){
  let p=rnd(2,6),q=rnd(2,6); while(q===p) q=rnd(2,6); const h=rnd(3,7), X=pick(['E','F','G','H']);
  const base={E:[p,0],F:[0,q],G:[-p,0],H:[0,-q]}[X], ans=[base[0],base[1],h], M=[0,0,h];
  const over={E:'A',F:'B',G:'C',H:'D'}[X];
  return {
    html:`<p>Die Grundfläche eines Prismas ist die Raute ABCD mit A${pt(p,0,0)}, B${pt(0,q,0)}, C${pt(-p,0,0)} und D${pt(0,-q,0)}. Die Deckfläche EFGH liegt senkrecht darüber (E über A, F über B, G über C, H über D). Die Höhe beträgt ${h}.</p>
          <p>Gib den Ortsvektor von <b>${X}</b> an. Gib außerdem den Mittelpunkt M der Deckfläche an.</p>`,
    inputs:[{key:'g',label:`Ortsvektor von ${X}`,type:'vec3'},{key:'m',label:'Mittelpunkt M der Deckfläche',type:'pt3'}],
    check(v){
      const msgs=[]; let ok=true;
      const w=coordMsg(v.g,ans); if(w.length){ ok=false; msgs.push(samePerm(v.g,ans)?NEAR(`Ortsvektor von ${X}: Die Zahlen sind richtig, aber in falscher Reihenfolge.`):wrongMsg(w,`(Ortsvektor von ${X}: ${X} liegt über ${over}.)`)); }
      const w2=coordMsg(v.m,M); if(w2.length){ ok=false; msgs.push(NEAR('Mittelpunkt der Deckfläche: Die Diagonalen der Raute schneiden sich über dem Ursprung. Welche Höhe hat die Deckfläche?')); }
      if(ok) msgs.push(OK()); return {ok,msgs};
    },
    tips:[`Die Diagonalen der Raute liegen auf den Achsen. ${X} liegt senkrecht über ${over}.`,`${X} hat x und y wie ${over}, nur die z-Koordinate ist die Höhe ${h}. Der Mittelpunkt der Deckfläche liegt über dem Schnittpunkt der Diagonalen, dem Ursprung.`],
    solution:`<p>${X} liegt über ${over}${pt(...base,0)}, also ${ov(X)}: ${vec(...ans)}.</p><p>Der Mittelpunkt der Deckfläche liegt über dem Ursprung: M${pt(...M)}.</p>`,
    correct:{g:ans,m:M}};
}

/* ---- 1b Verbindungsvektor und Länge ---- */
function gen1bB(){
  const P=[rnd(-5,6),rnd(-5,6),rnd(-5,6)], Q=[rnd(-5,6),rnd(-5,6),rnd(-5,6)];
  if(len2(sub(Q,P))===0) Q[0]+=2;
  const ans=sub(Q,P);
  return {
    html:`<p>Gegeben sind P${pt(...P)} und Q${pt(...Q)}.</p><p>Bestimme den Vektor ${ov('PQ')}.</p>`,
    inputs:[{key:'v',label:'Vektor PQ',type:'vec3'}],
    check(v){
      const w=coordMsg(v.v,ans); if(!w.length) return {ok:true,msgs:[OK()]};
      if(coordMsg(v.v,sub(P,Q)).length===0) return {ok:false,msgs:[NO('Du hast Anfang und Ende vertauscht. Das ist der Vektor von Q nach P. Merke: Spitze minus Fuß.')]};
      if(coordMsg(v.v,add(P,Q)).length===0) return {ok:false,msgs:[NO('Für einen Verbindungsvektor wird subtrahiert, nicht addiert.')]};
      return {ok:false,msgs:[wrongMsg(w,'Rechne jede Koordinate einzeln: Zielpunkt minus Startpunkt.')]};
    },
    tips:['Wie kommst du von P nach Q? Welche Schritte in x-, y- und z-Richtung?','PQ = Q − P, Koordinate für Koordinate: Zielpunkt minus Startpunkt.'],
    solution:`<p>${ov('PQ')} = Q − P = ${vec(...Q)} − ${vec(...P)} = ${vec(...ans)}</p>`, correct:{v:ans}};
}
const QUADS=[[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9],[1,2,2,3],[2,10,11,15],[3,4,12,13],[6,6,7,11],[2,2,1,3],[4,8,1,9]];
function gen1bV(){
  const q=pick(QUADS), comp=shuffle(q.slice(0,3)).map(x=>x*pick([1,-1])), L=q[3];
  const P=[rnd(-3,4),rnd(-3,4),rnd(-3,4)], Q=add(P,comp);
  return {
    html:`<p>Gegeben sind P${pt(...P)} und Q${pt(...Q)}.</p><p>Bestimme den Vektor ${ov('PQ')} und berechne seine Länge. Das Ergebnis ist eine ganze Zahl.</p>`,
    inputs:[{key:'v',label:'Vektor PQ',type:'vec3'},{key:'l',label:'Länge |PQ|',type:'num'}],
    check(v){
      const msgs=[]; let ok=true;
      if(coordMsg(v.v,comp).length){ ok=false; msgs.push(coordMsg(v.v,mul(-1,comp)).length===0?NO('Vektor: Anfang und Ende sind vertauscht. Spitze minus Fuß!'):NO('Der Vektor stimmt noch nicht: Q − P, Koordinate für Koordinate.')); }
      if(!close(v.l,L)){ ok=false;
        if(close(v.l,L*L)) msgs.push(NEAR('Länge: Du hast die Wurzel am Ende vergessen.'));
        else if(close(v.l,comp.reduce((s,x)=>s+Math.abs(x),0))) msgs.push(NEAR('Länge: Die Summe der Beträge ist nicht die Länge. Quadriere jede Koordinate, addiere und ziehe die Wurzel.'));
        else msgs.push(NEAR('Länge: Quadriere die drei Koordinaten, addiere sie und ziehe die Wurzel. Das Ergebnis ist eine ganze Zahl.')); }
      if(ok) msgs.push(OK()); return {ok,msgs};
    },
    tips:['Erst den Vektor bestimmen, dann seine Länge.',`Länge: Wurzel aus der Summe der Quadrate der Koordinaten. Tipp: ${q[0]}² + ${q[1]}² + ${q[2]}² ergibt eine Quadratzahl.`],
    solution:`<p>${ov('PQ')} = ${vec(...comp)}</p><p>|PQ| = √(${comp.map(x=>n2s(x)+'²').join(' + ')}) = √${len2(comp)} = ${L}</p>`, correct:{v:comp,l:L}};
}

/* ---- 1c Abstand / Streckenlänge ---- */
function gen1cB(){
  let d; do{ d=[rnd(-5,5),rnd(-5,5),rnd(-4,4)]; }while(len2(d)<5||isSquare(len2(d))||len2(d)>70);
  const A=[rnd(-3,4),rnd(-3,4),rnd(-2,3)], B=add(A,d), n=len2(d), ans=Math.sqrt(n);
  return {
    html:`<p>Berechne den Abstand der Punkte A${pt(...A)} und B${pt(...B)}.</p><p class="muted">Gib das Ergebnis exakt (z. B. √12) oder auf zwei Nachkommastellen genau an.</p>`,
    inputs:[{key:'d',label:'Abstand d(A; B)',type:'num',ph:'z. B. √12'}],
    check(v){
      if(close(v.d,ans,0.011)) return {ok:true,msgs:[OK()]};
      if(close(v.d,n,0.011)) return {ok:false,msgs:[NO('Du hast die Wurzel vergessen. Die Summe der Quadrate ist ' + n + '; der Abstand ist die Wurzel daraus.')]};
      if(close(v.d,Math.abs(d[0])+Math.abs(d[1])+Math.abs(d[2]),0.011)) return {ok:false,msgs:[NO('Der Abstand ist nicht die Summe der Differenzen. Quadriere zuerst, addiere dann, ziehe zuletzt die Wurzel.')]};
      if(close(v.d,Math.sqrt(d[0]**2+d[1]**2),0.011)||close(v.d,Math.sqrt(d[0]**2+d[2]**2),0.011)||close(v.d,Math.sqrt(d[1]**2+d[2]**2),0.011)) return {ok:false,msgs:[NO('Hast du alle drei Koordinaten berücksichtigt? Im Raum gehören x, y und z in die Rechnung.')]};
      if(Math.abs(v.d-ans)<0.2) return {ok:false,msgs:[NEAR('Dein Wert liegt sehr nah dran. Gib das Ergebnis exakt als Wurzel oder auf zwei Nachkommastellen an.')]};
      return {ok:false,msgs:[NO('Rechne die Differenzen der Koordinaten (Punkt B minus Punkt A), quadriere sie, addiere und ziehe die Wurzel.')]};
    },
    tips:['Der Abstand ist die Länge des Verbindungsvektors. Bestimme zuerst diesen Vektor.','d = √(Δx² + Δy² + Δz²) mit den drei Koordinatendifferenzen. Wurzel am Ende nicht vergessen.'],
    solution:`<p>${ov('AB')} = ${vec(...d)}</p><p>d = √(${d.map(x=>n2s(x)+'²').join(' + ')}) = √${n} ≈ ${n2s(ans)}</p>`, correct:{d:ans}};
}
function gen1cV(){
  let A,B,p,den,tries=0;
  do{ A=[rnd(1,6),rnd(1,6),rnd(1,6)]; B=[rnd(1,8),rnd(1,8),rnd(1,8)]; den=2*(B[1]-A[1]); p=den?(len2(B)-len2(A))/den:NaN; tries++; }
  while(!(isInt(p)&&Math.abs(p)<=14&&p!==0&&den!==0)&&tries<5000);
  const dA=q=>A[0]**2+(A[1]-q)**2+A[2]**2, dB=q=>B[0]**2+(B[1]-q)**2+B[2]**2;
  return {
    html:`<p>Gegeben sind A${pt(...A)} und B${pt(...B)}. Bestimme einen Punkt P auf der y-Achse, der von A und B gleich weit entfernt ist.</p>`,
    inputs:[{key:'p',label:'P(0 | p | 0): Wert von p',type:'num'}],
    check(v){
      if(close(dA(v.p),dB(v.p),1e-6)) return {ok:true,msgs:[OK()]};
      return {ok:false,msgs:[NO(`Mit deinem p ist |PA|² = ${n2s(dA(v.p))} und |PB|² = ${n2s(dB(v.p))}. Beide Werte müssen gleich sein.`)]};
    },
    tips:['Welche Koordinaten hat jeder Punkt der y-Achse? Was bedeutet „gleich weit entfernt“ als Gleichung?',`P(0 | p | 0). Setze |PA|² = |PB|². Beide Seiten ausrechnen; das p² hebt sich auf, es bleibt eine einfache Gleichung.`],
    solution:`<p>|PA|² = ${A[0]}² + (${A[1]} − p)² + ${A[2]}² = p² ${n2s(-2*A[1])}p + ${len2(A)}</p><p>|PB|² = ${B[0]}² + (${B[1]} − p)² + ${B[2]}² = p² ${n2s(-2*B[1])}p + ${len2(B)}</p><p>Gleichsetzen: p = ${n2s(p)}. Also P${pt(0,p,0)}.</p>`, correct:{p}};
}

/* ---- 1e Volumen Prisma mit Raute ---- */
function gen1eB(){
  const e=pick([4,6,8,10]); let f=pick([4,6,8,10,12]); while(f===e) f=pick([4,6,8,10,12]); const h=rnd(3,8), V=e*f*h/2;
  return {
    html:`<p>Ein Prisma hat als Grundfläche eine Raute mit den Diagonalen e = ${e} und f = ${f}. Die Höhe des Prismas beträgt ${h}.</p><p>Berechne das Volumen.</p>`,
    inputs:[{key:'v',label:'Volumen V (in VE)',type:'num'}],
    check(v){
      if(close(v.v,V)) return {ok:true,msgs:[OK()]};
      if(close(v.v,e*f*h)) return {ok:false,msgs:[NO('Du hast den Faktor ½ vergessen. Die Fläche einer Raute ist ½ · e · f, denn e · f wäre das Rechteck um die Raute.')]};
      if(close(v.v,e*f/2)) return {ok:false,msgs:[NO('Das ist nur die Grundfläche. Das Volumen ist Grundfläche mal Höhe.')]};
      if(close(v.v,e*f*h/8)||close(v.v,V/4)) return {ok:false,msgs:[NEAR('Das ist nur ein Viertel: Du hast ein einziges rechtwinkliges Dreieck verwendet. Die Raute besteht aus vier solchen Dreiecken.')]};
      return {ok:false,msgs:[NO('Rechne zuerst die Grundfläche (Raute: ½ · e · f), dann mal Höhe.')]};
    },
    tips:['Volumen eines Prismas: Grundfläche mal Höhe. Wie berechnest du die Fläche der Raute?','Raute: Die Diagonalen teilen sie in vier rechtwinklige Dreiecke mit den Katheten e/2 und f/2. Oder: A = ½ · e · f.'],
    solution:`<p>G = ½ · ${e} · ${f} = ${e*f/2}</p><p>V = G · h = ${e*f/2} · ${h} = ${V}</p>`, correct:{v:V}};
}
function gen1eV(){
  const e=pick([4,6,8,10]); let f=pick([4,6,8,10,12]); while(f===e) f=pick([4,6,8,10,12]); const h=rnd(3,8), V=e*f*h/2;

    {t:`4 · ½ · ${e/2} · ${f/2} · ${h} = ${V}`,c:true,ex:'Richtig: Vier rechtwinklige Dreiecke mit den Katheten e/2 und f/2, mal Höhe.'},
    {t:`½ · ${e} · ${f} · ${h} = ${V}`,c:true,ex:'Richtig: Grundfläche der Raute ½ · e · f, mal Höhe.'},
    {t:`${e} · ${f} · ${h} = ${e*f*h}`,c:false,ex:'Falsch: e · f ist die Fläche des Rechtecks um die Raute, also doppelt so groß wie die Raute.'},
    {t:`${f/2} · ${f/2} · ${h} = ${f*f*h/4}`,c:false,ex:`Falsch: Das wäre ein Quadrat mit der Seitenlänge ${f/2}. Eine Raute mit den Diagonalen ${e} und ${f} ist aber kein solches Quadrat.`}];

      if(!wrong.length) return {ok:true,msgs:[OK(' Hier die Begründungen:'),...msgs]};
      return {ok:false,msgs:[NO(`Bei ${wrong.length} Aussage(n) liegst du falsch. Überlege noch einmal, wie die Fläche einer Raute entsteht. Tipp 1 hilft.`)]};
    },
    tips:['Volumen = Grundfläche · Höhe. Wie groß ist die Rautenfläche? Zeichne die Raute mit ihren Diagonalen.','Die Diagonalen zerlegen die Raute in vier Dreiecke mit den Katheten e/2 und f/2. Prüfe jede Rechnung: Welche Grundfläche steckt darin?'],
    solution:`<p>Richtig sind genau die Rechnungen mit der Grundfläche ½ · ${e} · ${f} = ${e*f/2}:</p><ul>${order.map(o=>`<li><b>${o.t}</b>: ${o.ex}</li>`).join('')}</ul>`,
    correct:{c:order.map(o=>o.c)}};
}

const bild=(P)=>[P[1]-P[0]/2,P[2]-P[0]/2];
function gen1fV(){

    html:`<p>Im Schrägbild gilt: Der Punkt (x | y | z) erscheint bei (y − x/2 | z − x/2). Der Punkt P${pt(...P)} erscheint im Bild bei ${pt(...b)}.</p><p>Gib einen <b>anderen</b> Punkt Q ≠ P an, der im Schrägbild an <b>derselben Stelle</b> wie P erscheint.</p>`,
    inputs:[{key:'q',label:'Koordinaten von Q',type:'pt3'}],
    check(v){

    solution:`<p>Verschiebt man P um ${vec(2,1,1)} (oder ein Vielfaches), ändern sich die Bildkoordinaten nicht: y − x/2 wächst um 1 − 1 = 0, z − x/2 um 1 − 1 = 0.</p><p>Beispiel: Q${pt(...add(P,[2,1,1]))}.</p>`, correct:{q:add(P,[2,1,1])}};
}

/* ---- 2b Kollinearität ---- */
function gen2bB(){

  let v=mul(r,u); if(!coll){ const k=rnd(0,2); v[k]+=pick([1,-1,2]); }
  const isC=colinear(u,v)!==null, rr=colinear(u,v);
  const q=u.map((x,i)=>v[i]/x);
  return {
    html:`<p>Gegeben sind ${vec(...u)} = <b>u</b> und ${vec(...v)} = <b>v</b>.</p><p>Prüfe, ob u und v kollinear sind. Falls ja, gib den Faktor r mit v = r · u an.</p>`,
    inputs:[{key:'c',label:'Ergebnis',type:'radio',options:['kollinear','nicht kollinear']},{key:'r',label:'Faktor r (nur falls kollinear, sonst 0 eintragen)',type:'num'}],
    check(v2){
      const rows=q.map((x,i)=>`Zeile ${i+1}: ${n2s(v[i])} = r · ${n2s(u[i])} gibt r = ${n2s(x)}`).join('<br>');
      if(isC){
        if(v2.c!==0) return {ok:false,msgs:[NO('Prüfe jede Zeile einzeln, ob derselbe Faktor r herauskommt:<br>'+rows)]};
        if(!close(v2.r,rr)) return {ok:false,msgs:[NEAR('Richtig kollinear. Der Faktor r stimmt noch nicht: Teile eine Koordinate von v durch die gleiche Koordinate von u.')]};
        return {ok:true,msgs:[OK(' In jeder Zeile ergibt sich r = '+n2s(rr)+'.')]};
      }
      if(v2.c!==1) return {ok:false,msgs:[NO('Prüfe alle Zeilen: Der Faktor muss in jeder Zeile gleich sein.<br>'+rows)]};
      return {ok:true,msgs:[OK(' Die Zeilen liefern verschiedene Faktoren, also gibt es kein r.')]};
    },
    tips:['Kollinear heißt: Ein Vektor ist ein Vielfaches des anderen. Welchen Faktor siehst du in der ersten Zeile?','Ansatz v = r · u. Rechne in jeder Zeile r aus. Nur wenn überall derselbe Wert herauskommt, sind sie kollinear.'],
    solution:`<p>Ansatz ${'v = r · u'}:</p><p>${q.map((x,i)=>`Zeile ${i+1}: ${n2s(v[i])} = r · ${n2s(u[i])} gibt r = ${n2s(x)}`).join('<br>')}</p><p>${isC?`Überall ${n2s(rr)}: kollinear mit r = ${n2s(rr)}.`:'Die Faktoren unterscheiden sich: nicht kollinear.'}</p>`,
    correct:{c:isC?0:1,r:isC?rr:0}};
}
function gen2bV(){

  return {

/* ---- 2c kollinear und länger/kürzer ---- */
function gen2cB(){
  const u=[rnd(-3,4)||2,rnd(-3,4)||1,rnd(-3,5)||3];

    html:`<p>Gegeben ist ${vec(...u)} = <b>u</b>. Gib die Koordinaten eines Vektors an, der <b>kollinear</b> zu u und <b>länger</b> als u ist.</p>`,
    inputs:[{key:'v',label:'Dein Vektor',type:'vec3'}],

function gen2fB(){

/* ---- 4 Nullstellen ---- */
function polyStr(c){
  let s=''; Object.keys(c).map(Number).sort((a,b)=>b-a).forEach(d=>{ const k=c[d]; if(!k) return; const abs=Math.abs(k); const t=(abs===1&&d>0?'':abs)+(d>0?'x'+(d>1?sup(d):''):''); if(!s) s=(k<0?'−':'')+t; else s+=` ${k<0?'−':'+'} ${t}`; });
  return s;
}
function gen4B(){
  const typ=pick(['A','B','C']); let f,roots,steps;
  if(typ==='A'){ const a=rnd(2,9); f=`x${sup(2)} − ${a}x`; roots=[0,a]; steps=`<p>x² − ${a}x = x · (x − ${a}) = 0</p><p>x = 0 oder x − ${a} = 0, also x = 0 und x = ${a}.</p>`; }
  else if(typ==='B'){ const k=pick([2,3,4,5]), m=rnd(1,6); const sg=pick([1,-1]); f=polyStr({2:k,1:k*m*sg}); roots=[0,-m*sg]; steps=`<p>${f} = ${k}x · (x ${sg>0?'+':'−'} ${m}) = 0</p><p>x = 0 oder x ${sg>0?'+':'−'} ${m} = 0, also x = 0 und x = ${n2s(-m*sg)}.</p>`; }
  else { const a=rnd(2,7); f=`x${sup(3)} − ${a}x${sup(2)}`; roots=[0,a]; steps=`<p>x³ − ${a}x² = x² · (x − ${a}) = 0</p><p>x² = 0 oder x − ${a} = 0, also x = 0 (doppelte Nullstelle) und x = ${a}.</p>`; }
  return {
    html:`<p>Berechne die Nullstellen der Funktion f mit f(x) = ${f}.</p><p class="muted">Verfahren: Ausklammern und Satz vom Nullprodukt.</p>`,
    inputs:[{key:'n',label:'Nullstellen',type:'list',ph:'z. B. 0; 3'}],
    check(v){
      if(sameSet(v.n,roots)) return {ok:true,msgs:[OK()]};
      const u=uniq(v.n);
      if(!u.some(x=>close(x,0))&&roots.every(r=>r===0||u.some(x=>close(x,r)))) return {ok:false,msgs:[NO('Dir fehlt eine Nullstelle: Beim Ausklammern von x entsteht der Faktor x, und der ergibt x = 0. Teile nie durch x, sonst geht diese Lösung verloren.')]};
      if(roots.every(r=>r===0||u.some(x=>close(x,-r)))&&u.some(x=>close(x,0))) return {ok:false,msgs:[NEAR('Die Vorzeichen sind vertauscht. Aus x − 3 = 0 folgt x = 3, aus x + 3 = 0 folgt x = −3.')]};
      return {ok:false,msgs:[NO('Klammere zuerst den gemeinsamen Faktor aus, setze dann jeden Faktor gleich 0.')]};
    },
    tips:['Welcher Faktor steckt in jedem Summanden? Schau auf Zahlen und auf die kleinste Potenz von x.','Ausklammern, dann Nullproduktsatz: Jeden Faktor einzeln gleich 0 setzen. Nicht durch x teilen.'],
    solution:steps, correct:{n:roots}};
}
function gen4V(){
  let r1,r2; do{ r1=rnd(-5,6); r2=rnd(-5,6); }while(!r1||!r2||r1===r2);
  const typ=pick(['cubic','cubic2','quartic']);
  let f; const s=r1+r2, pr=r1*r2;
  if(typ==='cubic') f=polyStr({3:1,2:-s,1:pr});
  else if(typ==='cubic2'){ const k=pick([2,3]); f=polyStr({3:k,2:-k*s,1:k*pr}); }
  else f=polyStr({4:1,3:-s,2:pr});
  const lead=typ==='cubic2'?f.match(/^(\d+)/)[1]+'x':(typ==='quartic'?'x²':'x');
  const roots=[0,r1,r2];
  const pq=(typ==='quartic')?`x² − ${n2s(s)}x + ${n2s(pr)}`.replace('− −','+ ').replace('+ −','− '):'';
  const quad=`x² ${s>0?'−':'+'} ${Math.abs(s)}x ${pr>=0?'+':'−'} ${Math.abs(pr)}`;
  const pts=roots.map(r=>[r,0]);
  return {
    html:`<p>Gegeben ist f mit f(x) = ${f}.</p><p>a) Berechne die Nullstellen von f.<br>b) Bestimme die Schnittpunkte des Graphen von f mit der x-Achse.</p><p class="muted">Erlaubt sind Ausklammern, Satz vom Nullprodukt und pq-Formel. Für b) schreibst du Punkte, z. B. (2 | 0).</p>`,
    inputs:[{key:'n',label:'a) Nullstellen',type:'list',ph:'z. B. 0; 3; −2'},{key:'p',label:'b) Schnittpunkte mit der x-Achse',type:'pts',ph:'z. B. (0 | 0); (3 | 0)'}],
    check(v){
      const msgs=[]; let ok=true;
      if(!sameSet(v.n,roots)){ ok=false; const u=uniq(v.n);
        if(!u.some(x=>close(x,0))&&[r1,r2].every(r=>u.some(x=>close(x,r)))) msgs.push(NO('a) Es fehlt x = 0: Der ausgeklammerte Faktor x (bzw. 2x, 3x, x²) liefert die Nullstelle 0.'));
        else if([r1,r2].every(r=>u.some(x=>close(x,-r)))) msgs.push(NEAR('a) Vorzeichen: Bei der pq-Formel x = −p/2 ± … gehört das Vorzeichen zu p. Probe: Setze deine Werte in f ein.'));
        else if(u.some(x=>close(x,0))&&u.length===1) msgs.push(NEAR('a) Du hast nur x = 0 gefunden. Der Rest in der Klammer ist eine quadratische Gleichung: pq-Formel!'));
        else msgs.push(NO('a) Klammere zuerst x (bzw. den gemeinsamen Faktor) aus. Der Rest ist eine quadratische Gleichung für die pq-Formel.')); }
      const pp=v.p; const okP=pp&&pp.length===3&&pts.every(q=>pp.some(z=>close(z[0],q[0])&&close(z[1],0)));
      if(!okP){ ok=false; msgs.push(NEAR('b) Schnittpunkte sind Punkte (x | 0) auf der x-Achse. Die y-Koordinate ist immer 0. Du brauchst einen Punkt zu jeder Nullstelle.')); }
      if(ok) msgs.push(OK(' Nullstellen sind Zahlen (x-Werte), Schnittpunkte sind Punkte (x | 0).')); return {ok,msgs};
    },
    tips:['Erst x (bzw. x², oder die Zahl mit x) ausklammern. Was bleibt in der Klammer? Es ist eine quadratische Gleichung.',`In der Klammer steht ${quad}. Löse sie mit der pq-Formel. Zusammen mit der Nullstelle aus dem Faktor vor der Klammer ergeben sich alle Nullstellen. Für b) setzt du jede Nullstelle als (x | 0) ein.`],
    solution:`<p>f(x) = 0: ${lead} · (${quad}) = 0</p><p>${lead} = 0 gibt x = 0. Klammer: ${quad} = 0 mit p = ${n2s(-s)} und q = ${n2s(pr)}: x = ${n2s(s/2)} ± √(${n2s(s*s/4)} ${pr>=0?'−':'+'} ${Math.abs(pr)}) = ${n2s(s/2)} ± ${n2s(Math.abs(r1-r2)/2)}, also x = ${n2s(r1)} und x = ${n2s(r2)}.</p><p><b>a)</b> Nullstellen: 0, ${n2s(r1)}, ${n2s(r2)}</p><p><b>b)</b> Schnittpunkte: (0 | 0), (${n2s(r1)} | 0), (${n2s(r2)} | 0)</p>`,
    correct:{n:roots,p:pts}};
}

 {id:'1a',k:'1a',title:'Koordinaten und Ortsvektor angeben',info:'Eckpunkte eines Körpers bestimmen, Ortsvektor aufschreiben',gen:{basis:gen1aB,vert:gen1aV},
  merke:'Liegt ein Punkt senkrecht über einem anderen, haben beide dieselben x- und y-Koordinaten. Nur die z-Koordinate (Höhe) ist anders. Der Ortsvektor eines Punktes besteht aus seinen Koordinaten.'},
 {id:'1b',k:'1b',title:'Verbindungsvektor und seine Länge',info:'Vektor zwischen zwei Punkten bestimmen, Betrag berechnen',gen:{basis:gen1bB,vert:gen1bV},
  merke:'Verbindungsvektor: Spitze minus Fuß, also AB = B − A. Länge: |v| = √(x² + y² + z²).'},
 {id:'1c',k:'1c, 1d',title:'Abstand und Streckenlänge',info:'Abstand zweier Punkte berechnen, Länge einer Strecke',gen:{basis:gen1cB,vert:gen1cV},
  merke:'Abstand von A und B = Länge des Vektors AB = √((b₁−a₁)² + (b₂−a₂)² + (b₃−a₃)²). Schritte: Differenzen, quadrieren, addieren, Wurzel ziehen.'},
 {id:'1e',k:'1e',title:'Volumen eines Prismas mit Raute',info:'Rechnung auswählen und begründen',gen:{basis:gen1eB,vert:gen1eV},
  merke:'Volumen eines Prismas: V = Grundfläche · Höhe. Fläche einer Raute: A = ½ · e · f mit den Diagonalen e und f (vier rechtwinklige Dreiecke).'},
 {id:'1f',k:'1f',title:'Schrägbilder beurteilen',info:'Wirkung und Aussagekraft verschiedener Darstellungen',gen:{basis:gen1fB,vert:gen1fV},
  merke:'Draufsicht: Grundfläche in wahrer Gestalt. Seitenansicht: wahre Höhe. Schrägansicht: bester Raumeindruck, aber verzerrte Längen und Winkel. Im Schrägbild können verschiedene Raumpunkte am selben Bildpunkt liegen.'},
 {id:'2a',k:'2a',title:'Punkte im Schrägbild einzeichnen',info:'Bildpunkte berechnen und einzeichnen',gen:{basis:gen2aB,vert:gen2aV},
  merke:'Ein Punkt (x | y | z) erscheint bei (y − x/2 | z − x/2). Positives x: nach links unten. Negatives x: nach rechts oben.'},
 {id:'2b',k:'2b',title:'Kollinearität nachweisen',info:'Prüfen, ob zwei Vektoren kollinear sind',gen:{basis:gen2bB,vert:gen2bV},
  merke:'u und v sind kollinear, wenn v = r · u gilt. Derselbe Faktor r muss in jeder Zeile herauskommen. Ein Widerspruch in einer Zeile zeigt: nicht kollinear.'},
 {id:'2c',k:'2c',title:'Kollinearen Vektor angeben',info:'Vielfache eines Vektors bilden, Länge und Richtung',gen:{basis:gen2cB,vert:gen2cV},
  merke:'Vielfache r · u sind kollinear zu u. |r| > 1: länger. |r| < 1: kürzer. r < 0: entgegengesetzt gerichtet. Länge: |r · u| = |r| · |u|.'},
 {id:'2d',k:'2d',title:'Mittelpunkt einer Strecke',info:'Mittelpunkt berechnen und rückwärts bestimmen',gen:{basis:gen2dB,vert:gen2dV},
  merke:'Mittelpunkt: M = ½ · (A + B). Jede Koordinate einzeln mitteln. Umgekehrt: B = 2 · M − A.'},
 {id:'2e',k:'2e',title:'Punkte verschieben',info:'Bildpunkt und Verschiebungsvektor bestimmen',gen:{basis:gen2eB,vert:gen2eV},
  merke:'Verschieben: P′ = P + u. Verschiebungsvektor: u = P′ − P. Alle Punkte einer Figur werden um denselben Vektor verschoben.'},
 {id:'2f',k:'2f',title:'Parameter bei vorgegebener Länge',info:'Gleichung aus der Streckenlänge aufstellen und lösen',gen:{basis:gen2fB,vert:gen2fV},
  merke:'Vektor aufstellen, Betrag quadrieren, Gleichung lösen. Wegen des Betrags gibt es oft zwei Lösungen. Quadratische Gleichung: Normalform, dann pq-Formel.'},
 {id:'3',k:'3',title:'Vektoren zeichnerisch addieren',info:'Summen und Differenzen von Vektoren bestimmen',gen:{basis:gen3B,vert:gen3V},
  merke:'Addieren: Pfeile aneinanderhängen (Fuß an Spitze), Koordinaten addieren. Subtrahieren heißt, den Gegenvektor zu addieren. Vielfache: alle Koordinaten mit dem Faktor multiplizieren.'},
 {id:'4',k:'4',title:'Nullstellen berechnen',info:'Ausklammern, Satz vom Nullprodukt, pq-Formel',gen:{basis:gen4B,vert:gen4V},
  merke:'Gleich null setzen, ausklammern, Satz vom Nullprodukt, quadratische Faktoren mit der pq-Formel lösen. Nie durch x teilen. Nullstelle = x-Wert, Schnittpunkt mit der x-Achse = Punkt (x | 0).'}
];
const byId=id=>TOPICS.find(t=>t.id===id);

/* ===================== Speicher ===================== */
const KEY='ef-klausur-nachbereitung-v1';
let store={status:{},prog:{}};
try{ const r=localStorage.getItem(KEY); if(r) store=Object.assign(store,JSON.parse(r)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
function prog(id,lv){ store.prog[id]=store.prog[id]||{}; return store.prog[id][lv]=store.prog[id][lv]||{streak:0,right:0,done:0}; }

/* ===================== Oberfläche ===================== */
const S={screen:'start',filter:'all',topic:null,level:'basis',task:null,attempts:0,tip:0,solved:false,solShown:false,fb:null};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dots(n){ return '<span class="dots" aria-label="'+n+' von 3 richtig in Folge">'+[0,1,2].map(i=>'<i class="'+(i<n?'on':'')+'"></i>').join('')+'</span>'; }

function renderStart(){
  const stat=id=>store.status[id]||'';
  const filters=[['all','Alle'],['low','Nicht geschafft'],['mid','Unsicher'],['ok','Sicher'],['none','Noch offen']];
  const shown=TOPICS.filter(t=>S.filter==='all'||(S.filter==='none'?!stat(t.id):stat(t.id)===S.filter));
  const nLow=TOPICS.filter(t=>stat(t.id)==='low').length, nMid=TOPICS.filter(t=>stat(t.id)==='mid').length;
  let rec='';
  if(nLow||nMid){ const first=TOPICS.find(t=>stat(t.id)==='low')||TOPICS.find(t=>stat(t.id)==='mid'); rec=`<div class="card" style="background:var(--accent-soft);border-color:var(--accent)"><h3>Dein Start</h3><p style="margin:6px 0 10px">Beginne mit <b>${esc(first.k)} · ${esc(first.title)}</b> auf Basisniveau. ${nLow?nLow+' Teilaufgabe(n) markiert als „nicht geschafft“':nMid+' als „unsicher“'}.</p><button class="btn primary" data-go="${first.id}" data-lv="basis">Jetzt üben</button></div>`; }
  app.innerHTML=`
  <div class="top"><div><div class="eyebrow">Mathematik EF · Klausur 1</div><h1>Klausur nachbereiten</h1></div></div>
  <div class="intro">
    <p>Hier übst du gezielt die Teilaufgaben, bei denen du in der Klausur Punkte verloren hast. Die Aufgaben sind jedes Mal neu, du bekommst eine erste Rückmeldung, wenn etwas nicht stimmt, und Tipps in zwei Stufen.</p>
    <ol class="steps"><li><b>1. Einschätzen</b>Schau in deine Klausur und markiere jede Teilaufgabe.</li><li><b>2. Üben</b>Starte auf Basisniveau. Wenn es sitzt, wechsle zur Vertiefung.</li><li><b>3. Verstehen</b>Bei Fehlern erst die Rückmeldung lesen, dann selbst korrigieren.</li></ol>
  </div>
  ${rec}
  <h2 style="margin-top:22px">Wie lief es bei dir?</h2>
  <div class="filters" role="group" aria-label="Filter">${filters.map(f=>`<button class="chip" aria-pressed="${S.filter===f[0]}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
  <div class="list">${shown.map(t=>{ const s=stat(t.id), pb=prog(t.id,'basis'), pv=prog(t.id,'vert'); return `
    <div class="item" data-s="${s}">
      <div class="head"><h3>${esc(t.title)}</h3><span class="tag">Klausur ${esc(t.k)}</span></div>
      <div class="muted" style="font-size:.9rem">${esc(t.info)}</div>
      <div class="seg" role="group" aria-label="Einschätzung ${esc(t.k)}">
        ${[['low','Nicht geschafft'],['mid','Unsicher'],['ok','Sicher']].map(o=>`<button data-st="${t.id}" data-v="${o[0]}" aria-pressed="${s===o[0]}">${o[1]}</button>`).join('')}
      </div>
      <div class="go"><button class="btn ${s==='low'||s==='mid'||!s?'primary':''}" data-go="${t.id}" data-lv="basis">Basis üben</button> ${dots(Math.min(3,pb.streak))}
        <button class="btn ${s==='ok'?'primary':''}" data-go="${t.id}" data-lv="vert">Vertiefung</button> ${dots(Math.min(3,pv.streak))}</div>
    </div>`; }).join('')||'<p class="muted">Keine Teilaufgabe in dieser Auswahl.</p>'}</div>
  <details class="tips card"><summary>Lerntipps für die Nachbereitung</summary><ul>
    <li><b>Rechnen statt zuschauen:</b> Ein Lernvideo fühlt sich schnell verständlich an. Ob du es kannst, merkst du erst, wenn du selbst rechnest, ohne Vorlage.</li>
    <li><b>Erst selbst, dann Hilfe:</b> Probiere 5 bis 10 Minuten allein. Dann Rückmeldung und Tipp 1, danach Tipp 2. Den Lösungsweg schaust du zum Vergleichen an.</li>
    <li><b>Fehler sind Informationen:</b> Notiere dir, was schiefging und warum. Genau dieser Fehler taucht sonst in der nächsten Klausur wieder auf.</li>
    <li><b>Verteilt üben:</b> Zweimal 20 Minuten an verschiedenen Tagen bringen mehr als eine lange Sitzung.</li>
    <li><b>Erklären:</b> Erkläre einer Mitschülerin laut, warum dein Weg funktioniert.</li></ul></details>
  <p class="foot">Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Es werden keine Daten an die Lehrkraft gesendet.</p>`;
}

function newTask(){
  const t=byId(S.topic); S.task=t.gen[S.level](); S.attempts=0; S.tip=0; S.solved=false; S.solShown=false; S.fb=null;
}
function inputHTML(inp,idx){
  const id=`in-${inp.key}`;
  const nbox=(n,i,cls)=>`<input class="num" id="${id}-${i}" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="${esc(inp.label)} ${NAMES[i]||i+1}" ${cls||''}>`;
  let body='';
  if(inp.type==='num') body=`<div class="row"><input class="num wide" id="${id}-0" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${esc(inp.ph||'')}" aria-label="${esc(inp.label)}"></div>`;
  else if(inp.type==='pt3') body=`<div class="row"><span class="sep">(</span>${[0,1,2].map(i=>nbox(3,i)).join('<span class="sep">|</span>')}<span class="sep">)</span></div>`;
  else if(inp.type==='pt2') body=`<div class="row"><span class="sep">(</span>${[0,1].map(i=>nbox(2,i)).join('<span class="sep">|</span>')}<span class="sep">)</span></div>`;
  else if(inp.type==='vec3') body=`<div class="vecin">${[0,1,2].map(i=>nbox(3,i)).join('')}</div>`;
  else if(inp.type==='vec2') body=`<div class="vecin">${[0,1].map(i=>nbox(2,i)).join('')}</div>`;
  else if(inp.type==='list'||inp.type==='pts') body=`<div class="row"><input class="num wide" id="${id}-0" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${esc(inp.ph||'')}" aria-label="${esc(inp.label)}"></div>`;
  else if(inp.type==='radio') body=`<div class="field" role="radiogroup" aria-label="${esc(inp.label)}">${inp.options.map((o,i)=>`<label class="opt" id="${id}-opt${i}"><input type="radio" name="${id}" value="${i}"><span>${o}</span></label>`).join('')}</div>`;
  else if(inp.type==='checks') body=`<div class="field">${inp.options.map((o,i)=>`<label class="opt" id="${id}-opt${i}"><input type="checkbox" value="${i}" id="${id}-c${i}"><span class="mono">${o}</span></label>`).join('')}</div>`;
  return `<div class="field"><div class="lab">${esc(inp.label)}</div>${body}</div>`;
}
function collect(){
  const vals={}; let missing=false;
  S.task.inputs.forEach(inp=>{
    const id=`in-${inp.key}`, g=i=>{const e=document.getElementById(`${id}-${i}`); return e?e.value:'';};
    if(inp.type==='num'){ const x=parseExpr(g(0)); if(isNaN(x)) missing=true; vals[inp.key]=x; }
    else if(inp.type==='pt3'||inp.type==='vec3'){ const a=[0,1,2].map(i=>parseExpr(g(i))); if(a.some(isNaN)) missing=true; vals[inp.key]=a; }
    else if(inp.type==='pt2'||inp.type==='vec2'){ const a=[0,1].map(i=>parseExpr(g(i))); if(a.some(isNaN)) missing=true; vals[inp.key]=a; }
    else if(inp.type==='list'){ const a=parseList(g(0)); if(!a) missing=true; vals[inp.key]=a||[]; }
    else if(inp.type==='pts'){ const a=parsePts(g(0)); if(!a) missing=true; vals[inp.key]=a||[]; }
    else if(inp.type==='radio'){ const r=document.querySelector(`input[name="${id}"]:checked`); if(!r) missing=true; vals[inp.key]=r?+r.value:-1; }
    else if(inp.type==='checks'){ vals[inp.key]=inp.options.map((o,i)=>document.getElementById(`${id}-c${i}`).checked); }
  });
  return {vals,missing};
}
function msgsHTML(msgs){ return msgs.map(m=>`<div class="msg ${m.t}">${m.h}</div>`).join(''); }

function renderPractice(){
  const t=byId(S.topic), p=prog(t.id,S.level), task=S.task;
  const canTip2=S.tip>=1, canSol=S.attempts>=2||S.tip>=2||S.solved;
  app.innerHTML=`
  <div class="top"><button class="btn ghost" id="back">← Übersicht</button></div>
  <div class="eyebrow">Klausur ${esc(t.k)}</div><h2>${esc(t.title)}</h2>
  <div class="levelbar" role="group" aria-label="Niveau">
    <button aria-pressed="${S.level==='basis'}" data-lvl="basis">Basis<small>Das Verfahren sicher anwenden</small></button>
    <button aria-pressed="${S.level==='vert'}" data-lvl="vert">Vertiefung<small>Mehr Schritte, mehr Nachdenken</small></button></div>
  <div class="card">
    <div class="streak">${dots(Math.min(3,p.streak))}<span>${p.streak>=3?'Stark! Drei richtig in Folge.':'Ziel: drei Aufgaben richtig in Folge'}</span></div>
    <div class="task" id="taskbox">${task.html}</div>
    <form class="inputs" id="form" autocomplete="off">${task.inputs.map(inputHTML).join('')}
      <div class="actions"><button type="submit" class="btn primary" id="check">Prüfen</button>
      <button type="button" class="btn" id="tip1">Tipp 1</button>
      <button type="button" class="btn" id="tip2" ${canTip2?'':'disabled'}>Tipp 2</button>
      <button type="button" class="btn" id="sol" ${canSol?'':'disabled'}>Lösungsweg</button>
      <button type="button" class="btn ghost" id="next">${S.solved?'Nächste Aufgabe':'Andere Aufgabe'}</button></div>
    </form>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>
  <details class="card merke"><summary style="cursor:pointer;font-family:var(--head);font-weight:600">Merkhilfe zu diesem Thema</summary><p style="margin:10px 0 0">${esc(t.merke)}</p></details>`;
  renderFb();
}
function renderFb(){
  const el=document.getElementById('fb'); if(!el) return;
  const task=S.task; let h='';
  if(S.fb) h+=msgsHTML(S.fb);
  if(S.tip>=1) h+=`<div class="tipbox"><b>Tipp 1 · Denkanstoß</b><br>${esc(task.tips[0])}</div>`;
  if(S.tip>=2) h+=`<div class="tipbox"><b>Tipp 2 · Ansatz</b><br>${esc(task.tips[1])}</div>`;
  if(S.solShown) h+=`<div class="sol"><b>Lösungsweg</b>${task.solution}<p class="muted" style="margin:8px 0 0">Vergleiche mit deinem Weg: Wo genau weichst du ab? Rechne danach eine neue Aufgabe selbst.</p></div>`;
  if(S.solved){ const p=prog(S.topic,S.level);
    if(p.streak>=3&&S.level==='basis') h+=`<div class="banner"><b>Drei in Folge auf Basisniveau.</b> Du kannst es offenbar. <div class="actions"><button class="btn primary" id="toV">Zur Vertiefung</button><button class="btn" id="markOk">Als „sicher“ markieren</button></div></div>`;
    else if(p.streak>=3) h+=`<div class="banner"><b>Auch die Vertiefung sitzt.</b> <div class="actions"><button class="btn" id="markOk">Als „sicher“ markieren</button><button class="btn ghost" id="backList">Zur Übersicht</button></div></div>`; }
  el.innerHTML=h;
  const b1=document.getElementById('toV'); if(b1) b1.onclick=()=>{S.level='vert';newTask();renderPractice();};
  const b2=document.getElementById('markOk'); if(b2) b2.onclick=()=>{store.status[S.topic]='ok';save();b2.textContent='Gespeichert ✓';b2.disabled=true;};
  const b3=document.getElementById('backList'); if(b3) b3.onclick=()=>{S.screen='start';render();};
  const t2=document.getElementById('tip2'); if(t2) t2.disabled=S.tip<1;
  const sl=document.getElementById('sol'); if(sl) sl.disabled=!(S.attempts>=2||S.tip>=2||S.solved);
}
function markChecks(task,vals){
  task.inputs.forEach(inp=>{ if(inp.type==='checks'){ inp.options.forEach((o,i)=>{ const lab=document.getElementById(`in-${inp.key}-opt${i}`); if(!lab) return; lab.classList.remove('right','wrong'); }); } });
}
function onSubmit(e){
  e.preventDefault(); if(S.solved) return;
  const {vals,missing}=collect();
  if(missing){ S.fb=[{t:'near',h:'<b>Bitte fülle alle Felder aus.</b>Zahlen, Brüche wie 1/2 und Wurzeln wie √12 sind erlaubt. Bei Auswahlfragen wähle eine Antwort.'}]; renderFb(); return; }
  let res; try{ res=S.task.check(vals); }catch(err){ res={ok:false,msgs:[{t:'near',h:'<b>Das konnte ich nicht auswerten.</b>Prüfe die Schreibweise deiner Eingabe.'}]}; }
  const p=prog(S.topic,S.level); p.done++;
  if(res.ok){ S.solved=true; p.streak++; p.right++; S.fb=res.msgs; save(); renderPractice(); document.getElementById('check').disabled=true; document.getElementById('next').textContent='Nächste Aufgabe'; }
  else { S.attempts++; p.streak=0; S.fb=res.msgs.concat(S.attempts>=2?[{t:'near',h:'<b>Tipp:</b>Du kannst jetzt Tipp 1 und Tipp 2 öffnen. Nach zwei Versuchen ist auch der Lösungsweg freigeschaltet.'}]:[]); save(); renderFb(); }
}
function render(){ if(S.screen==='start') renderStart(); else renderPractice(); window.scrollTo(0,0); }

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.f){ S.filter=b.dataset.f; renderStart(); return; }
  if(b.dataset.st){ const cur=store.status[b.dataset.st]; store.status[b.dataset.st]=cur===b.dataset.v?'':b.dataset.v; save(); renderStart(); return; }
  if(b.dataset.go){ S.topic=b.dataset.go; S.level=b.dataset.lv; S.screen='practice'; newTask(); render(); return; }
  if(b.dataset.lvl){ S.level=b.dataset.lvl; newTask(); renderPractice(); return; }
  if(b.id==='back'){ S.screen='start'; render(); return; }
  if(b.id==='tip1'){ S.tip=Math.max(S.tip,1); renderFb(); return; }
  if(b.id==='tip2'){ S.tip=Math.max(S.tip,2); renderFb(); return; }
  if(b.id==='sol'){ S.solShown=true; renderFb(); return; }
  if(b.id==='next'){ newTask(); renderPractice(); return; }
});
document.addEventListener('submit',ev=>{ if(ev.target.id==='form') onSubmit(ev); });
render();
</script>
